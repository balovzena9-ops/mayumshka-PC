appId: com.myrunplay.mayumshka
productName: MayUmshka
copyright: "© 2026 MYRUNPLAY"

directories:
  output: dist
  buildResources: build

files:
  - "index.html"
  - "main.js"
  - "package.json"
  - "build/icon.ico"
  - "build/icon.png"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: "${productName}-${version}-Setup.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "MayUmshka"
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  deleteAppDataOnUninstall: false
  runAfterFinish: true

# Заглушки, чтобы electron-builder не ругался при сборке только Windows
mac:
  target: []
linux:
  target: []
