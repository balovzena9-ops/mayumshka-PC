appId: com.myrunplay.mayumshka
productName: MayUmshka
copyright: Copyright © 2026 MYRUNPLAY

directories:
  output: dist
  buildResources: build

files:
  - main.js
  - www/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  artifactName: "${productName}-${version}-${arch}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "MayUmshka"

portable:
  artifactName: "${productName}-${version}-portable-x64.${ext}"
